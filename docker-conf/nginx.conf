worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server{
        client_max_body_size 200M;
        listen 80;
        server_name maestro;
        root /usr/share/nginx/html/;
        index index.html;

        add_header X-Frame-Options "allow-from https://myworkplace-int.bmwgroup.net https://myworkplace.bmwgroup.net";
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload';
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "frame-ancestors https://myworkplace-int.bmwgroup.net https://myworkplace.bmwgroup.net 'self';";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;

        location / {
            try_files $uri$args $uri$args/ /index.html;
        }

        location /test/ {
            proxy_pass http://test_be:8080/test/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* ^.+\.css$ {
            default_type text/css;
        }

        location ~* ^.+\.js$ {
            default_type text/javascript;
        }

        location ~* ^.+\.svg$ {
            default_type image/svg+xml;
        }
    }
}
